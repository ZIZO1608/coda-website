# Pages revalidate on every visit so edits show up immediately; images and icons cache for 30 days.
map $sent_http_content_type $cache_control {
    default    "no-cache";
    ~^image/   "public, max-age=2592000";
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # TLS ends at Coolify's proxy; relative redirects keep the visitor on https
    absolute_redirect off;
    server_tokens off;
    charset utf-8;
    charset_types text/plain text/css application/javascript application/json application/xml application/manifest+json;

    gzip on;
    gzip_comp_level 6;
    gzip_min_length 512;
    gzip_types text/plain text/css application/javascript text/javascript application/json
               application/manifest+json application/xml image/svg+xml;

    add_header Cache-Control $cache_control always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # one host: www.coda-media.com/... → coda-media.com/... (permanent, so Google merges them)
    if ($host ~* ^www\.(.+)$) { return 301 https://$1$request_uri; }

    # one URL per page: /index.html → /   and   /ar/index.html → /ar/   (/ar → /ar/ is automatic)
    if ($request_uri ~ ^/((?:ar/)?)index\.html(?:\?.*)?$) { return 301 /$1; }

    location / {
        try_files $uri $uri/ =404;
    }

    location ~* \.(?:webp|png|jpe?g|svg|ico|gif|avif)$ {
        access_log off;
        try_files $uri =404;
    }

    location = /site.webmanifest {
        default_type application/manifest+json;
        types { }
    }

    error_page 404 /404.html;
}
